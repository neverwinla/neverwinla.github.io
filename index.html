<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Hao Liu</title>
  <script>
    // Preserve task links shared before the viewer moved into its project folder.
    if (new URLSearchParams(location.hash.slice(1)).has('run')) {
      location.replace('/mimic-universe/' + location.search + location.hash);
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #17202e; background: #fff; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 860px; margin: 80px auto; padding: 0 24px; }
    header { padding-bottom: 25px; border-bottom: 1px solid #e2e6eb; }
    h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.5px; }
    header p { margin: 6px 0 0; color: #657080; font-size: 14px; }
    .project { display: block; padding: 25px 0; border-bottom: 1px solid #e2e6eb; color: inherit; text-decoration: none; }
    .project h2 { display: flex; justify-content: space-between; gap: 20px; margin: 0; font-size: 20px; font-weight: 600; }
    .project h2 span { color: #005a9e; font-weight: 400; }
    .project p { margin: 8px 0 0; color: #657080; font-size: 14px; }
    .project:hover h2 { color: #005a9e; }
    a:focus-visible { outline: 2px solid #005a9e; outline-offset: 6px; }
    @media (max-width: 600px) { main { margin-top: 40px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Projects</h1><p>Hao Liu · 项目与演示</p></header>
    <a class="project" href="/mimic-universe/">
      <h2>MIMIC Universe <span aria-hidden="true">↗</span></h2>
